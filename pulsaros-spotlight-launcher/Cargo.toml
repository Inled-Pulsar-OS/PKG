[package]
name = "pulsaros-spotlight"
version = "2.0.0"
edition = "2021"
authors = ["Jaime <info@inled.es>"]

[dependencies]
gtk4 = { version = "0.9" }
adw = { version = "0.7", package = "libadwaita" }
zbus = { version = "4.4" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32" }
dirs = "5.0"
mime_guess = "2.0"
urlencoding = "2.1"
regex = "1.10"
lazy_static = "1.4"
libc = "0.2"
