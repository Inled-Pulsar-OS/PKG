[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "pulsaros-spotlight"
version = "2.0.0"
description = "Spotlight search for Pulsar OS"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
authors = [
    { name = "Jaime", email = "info@inled.es" },
]
dependencies = [
    "pygobject>=3.48",
]

[project.scripts]
pulsaros-spotlight = "pulsaros_spotlight.app:main"

[project.gui-scripts]
pulsaros-spotlight-gui = "pulsaros_spotlight.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pulsaros_spotlight = ["*.css"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
