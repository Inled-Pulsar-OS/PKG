# Pulsar OS — Keep ALSA audio hardware active.
#
# WirePlumber suspends (powers down) ALSA nodes after 5 idle seconds. On some
# HDA/SOF laptops (common on HP) the node never wakes up cleanly afterwards:
# the sink stays on "suspended" and no user-session sound is produced, while
# raw `aplay` as root (e.g. the boot sound) still works.
#
# Setting session.suspend-timeout-seconds = 0 disables the suspend policy
# entirely (see suspend-node.lua: `if timeout == 0 then return end`), so the
# audio device stays ready at all times.
#
# Applied to every ALSA input/output node (internal speakers, HDMI, USB, BT
# handled by their own rules on bluez).
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_input.*" }
      { node.name = "~alsa_output.*" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
      }
    }
  }
]