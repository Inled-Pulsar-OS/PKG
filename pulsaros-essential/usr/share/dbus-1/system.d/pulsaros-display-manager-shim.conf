<?xml version="1.0"?> <!--*-nxml-*-->
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Pulsar OS: allow the GDM compatibility shim to own the org.gnome.DisplayManager
       name even when the real GDM is not running (Pulsar OS uses SDDM). GNOME
       Shell queries this name to decide whether the screen can be locked. -->
  <policy user="root">
    <allow own="org.gnome.DisplayManager"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.gnome.DisplayManager"/>
    <allow receive_sender="org.gnome.DisplayManager"/>
  </policy>
</busconfig>
