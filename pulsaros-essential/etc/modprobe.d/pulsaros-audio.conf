# Pulsar OS — Audio fixes for Intel HDA laptops (very common on HP).
#
# The kernel powers down the HDA codec after a few seconds of inactivity
# (snd_hda_intel power_save). On many HP laptops this makes the internal
# speakers/headphones produce no sound after the first idle timeout, right
# up to showing a "Dummy Output" sink. Disabling power_save keeps the codec
# awake and is the standard fix; the extra power cost is negligible for a
# laptop that is listening to audio, and pipewire still suspends DSP nodes.
#
# Scope: only the legacy HDA driver module. SOF-based cards use a different
# module and are unaffected by this file (they are handled in
# 50-pulsar-no-suspend.conf under WirePlumber).
options snd_hda_intel power_save=0 power_save_controller=N