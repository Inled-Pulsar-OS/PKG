# Pulsar OS — Wi-Fi power management fixes for MediaTek MT7921 / MT7922 / MT7925
#
# MediaTek Wi-Fi modules (RZ608, RZ616, RZ717) paired with AMD Ryzen / Ryzen AI
# platforms suffer from PCIe ASPM (Active State Power Management) sleep timeouts
# during system suspend (e.g. error -110 in pci_pm_suspend). This causes suspend
# loops, failed wakeups, and input/lock screen timeouts.
# Disabling PCIe ASPM on mt7925e/mt7921e ensures reliable suspend and resume cycles.
options mt7925e disable_aspm=1
options mt7921e disable_aspm=1
