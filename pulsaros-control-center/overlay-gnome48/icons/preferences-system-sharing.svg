  <!-- Centered Lucide Vector Glyph -->
  <g transform="translate(10, 10) scale(1.1666)">
    <circle cx="18" cy="5" r="3" stroke="white" stroke-width="2" fill="none"/>
                  <circle cx="6" cy="12" r="3" stroke="white" stroke-width="2" fill="none"/>
                  <circle cx="18" cy="19" r="3" stroke="white" stroke-width="2" fill="none"/>
                  <line x1="8.59" y1="13.51" x2="15.42" y2="17.49" stroke="white" stroke-width="2"/>
                  <line x1="15.41" y1="6.51" x2="8.59" y2="10.49" stroke="white" stroke-width="2"/>
  </g>
</svg>
