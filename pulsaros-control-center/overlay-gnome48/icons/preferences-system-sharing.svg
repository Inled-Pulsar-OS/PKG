<?xml version="1.0" encoding="UTF-8"?>
<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="24" y1="0" x2="24" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#32D74B"/>
      <stop offset="1" stop-color="#32D74B" stop-opacity="0.85"/>
    </linearGradient>
  </defs>
  <!-- Apple squircle background (22% radius on 48px = 11px rx) -->
  <rect width="48" height="48" rx="11" fill="url(#bg)"/>
  
  <!-- Subtle inner top highlight border -->
