<?xml version="1.0" encoding="UTF-8"?>
<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="24" y1="0" x2="24" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8E8E93"/>
      <stop offset="1" stop-color="#8E8E93" stop-opacity="0.85"/>
    </linearGradient>
  </defs>
  <!-- Apple squircle background (22% radius on 48px = 11px rx) -->
  <rect width="48" height="48" rx="11" fill="url(#bg)"/>
  
  <!-- Subtle inner top highlight border -->
  <rect x="0.75" y="0.75" width="46.5" height="46.5" rx="10.25" stroke="white" stroke-opacity="0.2" stroke-width="1.5"/>

  <!-- Centered Lucide Vector Glyph -->
  <g transform="translate(10, 10) scale(1.1666)">
    <rect x="2" y="4" width="20" height="16" rx="4" stroke="white" stroke-width="2.2" fill="none"/>
                  <line x1="6" y1="8" x2="6.01" y2="8" stroke="white" stroke-width="2.2" stroke-linecap="round"/>
                  <line x1="10" y1="8" x2="10.01" y2="8" stroke="white" stroke-width="2.2" stroke-linecap="round"/>
                  <line x1="14" y1="8" x2="14.01" y2="8" stroke="white" stroke-width="2.2" stroke-linecap="round"/>
                  <line x1="18" y1="8" x2="18.01" y2="8" stroke="white" stroke-width="2.2" stroke-linecap="round"/>
                  <line x1="8" y1="16" x2="16" y2="16" stroke="white" stroke-width="2.2" stroke-linecap="round"/>
  </g>
</svg>
