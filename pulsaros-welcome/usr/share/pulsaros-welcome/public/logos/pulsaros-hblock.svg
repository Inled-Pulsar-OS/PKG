<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3584e4"/>
      <stop offset="50%" stop-color="#9141ac"/>
      <stop offset="100%" stop-color="#e01b24"/>
    </linearGradient>
    <linearGradient id="shield" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8ecf1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>

  <!-- Shield -->
  <g filter="url(#shadow)">
    <path d="M64 22 L98 34 V64 C98 86 84 100 64 108 C44 100 30 86 30 64 V34 Z"
          fill="url(#shield)" stroke="#ffffff" stroke-width="3"/>
    <!-- Block badge: circle + slash -->
    <circle cx="64" cy="66" r="20" fill="none" stroke="#e01b24" stroke-width="8"/>
    <line x1="50" y1="52" x2="78" y2="80" stroke="#e01b24" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>