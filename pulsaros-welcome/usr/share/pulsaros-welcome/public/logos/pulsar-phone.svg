<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="pulsarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3584e4"/>
      <stop offset="50%" stop-color="#9141ac"/>
      <stop offset="100%" stop-color="#e01b24"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background rounded rectangle (Pulsar squircle) -->
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#pulsarGrad)" filter="url(#shadow)"/>

  <!-- Pulsar Phone (Smartphone Icon) -->
