     fill="none"
     stroke="#FFFFFF"
     stroke-linecap="round"
     stroke-linejoin="round">
    <path stroke-width="3.5" d="M46,32 L62,32 A5,5 0 0,1 67,37 L67,71 A5,5 0 0,1 62,76 L46,76 A5,5 0 0,1 41,71 L41,37 A5,5 0 0,1 46,32 Z"/>
    <path stroke-width="2.5" d="M51,37 L57,37"/>
    <path stroke-width="3.5" d="M54,71 L54.01,71"/>
  </g>
</svg>