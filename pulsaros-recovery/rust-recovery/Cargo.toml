[package]
name = "pulsar-recovery-assistant"
version = "1.0.0"
edition = "2021"

[dependencies]
gtk4 = { version = "0.9", features = ["v4_12"] }
libadwaita = { version = "0.7", features = ["v1_5"] }
glib = "0.20"
gio = "0.20"
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

