[package]
name = "pulsaros-recovery"
version = "1.0.0"
description = "Pulsar OS Recovery Assistant"
authors = ["Inled <info@inled.es>"]
edition = "2021"

[lib]
name = "pulsaros_recovery_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
tokio = { version = "1", features = ["rt"] }
