[Service]
# Pulsar OS: Auto-sync Btrfs physical resume offset to rEFInd and sysfs before memory dump
ExecStartPre=-/usr/bin/pulsaros-setup-hibernation
ExecStartPre=-/usr/lib/pulsaros/verify-resume-offset
ExecStartPre=-/usr/lib/pulsaros/sleep-progress start
# Note: post-resume session restoration is handled by pulsaros-resume-session.service
# which runs After=systemd-hibernate-resume.service once userspace is fully restored.
