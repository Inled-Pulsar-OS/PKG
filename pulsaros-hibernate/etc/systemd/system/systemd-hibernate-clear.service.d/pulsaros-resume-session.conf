[Unit]
# Pulsar OS: When the system detects a successful hibernate resume (via the EFI
# HibernateLocation variable that systemd-hibernate-clear reads), also activate
# our graphical session restoration service.
# This is the correct trigger for post-hibernate resume with HibernateMode=shutdown,
# where there is no system-sleep "post" hook callback.
Wants=pulsaros-resume-session.service
After=pulsaros-resume-session.service
