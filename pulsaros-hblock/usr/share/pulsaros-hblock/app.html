<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ad Block</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#fff;font-family:system-ui,sans-serif;height:100vh;display:flex;align-items:center;justify-content:center}
#b{width:280px;height:280px;border-radius:50%;border:none;color:#fff;font-weight:900;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1.1;transition:background .35s ease,transform .15s ease;font-size:1.6rem;letter-spacing:-.02em;box-shadow:0 10px 30px rgba(0,0,0,.12)}
#b.red{background:#ff0000}
#b.green{background:#00cc00}
#b:active{transform:scale(.96)}
#n{font-size:0.85rem;font-weight:700;opacity:.9;margin-top:4px}
</style>
</head>
<body>
<button id="b" class="red" onclick="toggle()" aria-label="Activar bloqueo">
  <div>NO ESTÁS PROTEGIDO</div>
  <div id="n">—</div>
</button>
<script>
function setUI(d){
  const on=d&&d.enabled===true;
  const b=document.getElementById('b');
  b.className=on?'green':'red';
  b.querySelector('div').textContent=on?'PROTEGIDO':'NO ESTÁS PROTEGIDO';
  document.getElementById('n').textContent=(d&&d.blocked)?d.blocked.toLocaleString()+' DOMINIOS BLOQUEADOS':'—';
}
function toggle(){if(window.webkit&&window.webkit.messageHandlers&&window.webkit.messageHandlers.pulsarAction)window.webkit.messageHandlers.pulsarAction.postMessage(JSON.stringify({action:'toggle'}));}
window.addEventListener('load',function(){setTimeout(function(){if(window.webkit&&window.webkit.messageHandlers&&window.webkit.messageHandlers.pulsarAction)window.webkit.messageHandlers.pulsarAction.postMessage(JSON.stringify({action:'status'}));},300);});
</script>
</body>
</html>
