name: Notify Discord

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened, closed, merged]
  release:
    types: [published]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Notify on issue
        if: github.event_name == 'issues'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          TITLE='${{ github.event.issue.title }}'
          URL='${{ github.event.issue.html_url }}'
          REPO='${{ github.repository }}'

          # Extract fields from body
          BODY='${{ github.event.issue.body }}'
          DIFF=$(echo "$BODY" | sed -n '/^### Difficulty$/,/^### /{/^### Difficulty$/d;/^### /d;p}' | head -1 | xargs)
          PHASE=$(echo "$BODY" | sed -n '/^### Roadmap Phase$/,/^### /{/^### Roadmap Phase$/d;/^### /d;p}' | head -1 | xargs)

          # Build extras string
          EXTRAS=""
          [ -n "$DIFF" ] && EXTRAS="${EXTRAS}
📋 Difficulty: **${DIFF}**"
          [ -n "$PHASE" ] && EXTRAS="${EXTRAS}
🗺️ Roadmap: **${PHASE}**"

          PAYLOAD=$(printf '{"content":"🟢 **%s**\nRepo: `%s`%s\n%s"}' \
            "$TITLE" "$REPO" "$EXTRAS" "$URL" | jq -c '.')
          curl -s -X POST "$DISCORD_WEBHOOK" -H "Content-Type: application/json" -d "$PAYLOAD"

      - name: Notify on PR
        if: github.event_name == 'pull_request'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          TITLE='${{ github.event.pull_request.title }}'
          URL='${{ github.event.pull_request.html_url }}'
          REPO='${{ github.repository }}'
          PAYLOAD=$(printf '{"content":"🔀 **PR: %s**\nRepo: `%s`\n%s"}' \
            "$TITLE" "$REPO" "$URL" | jq -c '.')
          curl -s -X POST "$DISCORD_WEBHOOK" -H "Content-Type: application/json" -d "$PAYLOAD"

      - name: Notify on release
        if: github.event_name == 'release'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          NAME='${{ github.event.release.name }}'
          URL='${{ github.event.release.html_url }}'
          REPO='${{ github.repository }}'
          PAYLOAD=$(printf '{"content":"🚀 **New Release: %s**\nRepo: `%s`\n%s"}' \
            "$NAME" "$REPO" "$URL" | jq -c '.')
          curl -s -X POST "$DISCORD_WEBHOOK" -H "Content-Type: application/json" -d "$PAYLOAD"
