name: Notify Discord

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened, closed, merged]
  release:
    types: [published]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Notify on issue
        if: github.event_name == 'issues'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          TITLE=$(echo '${{ toJSON(github.event.issue.title) }}' | jq -r '.')
          URL="${{ github.event.issue.html_url }}"
          REPO="${{ github.repository }}"
          BODY=$(echo '${{ toJSON(github.event.issue.body) }}' | jq -r '.')
          DIFF=$(echo "$BODY" | sed -n '/^### Difficulty$/,/^### /{/^### Difficulty$/d;/^### /d;p}' | head -1 | xargs)
          PHASE=$(echo "$BODY" | sed -n '/^### Roadmap Phase$/,/^### /{/^### Roadmap Phase$/d;/^### /d;p}' | head -1 | xargs)

          MSG=$(echo -e "🟢 **${TITLE}**\nRepo: \`${REPO}\`")
          [ -n "$DIFF" ] && MSG=$(echo -e "${MSG}\n📋 Difficulty: **${DIFF}**")
          [ -n "$PHASE" ] && MSG=$(echo -e "${MSG}\n🗺️ Roadmap: **${PHASE}**")
          MSG=$(echo -e "${MSG}\n${URL}")

          jq -n --arg msg "$MSG" '{"content": $msg}' | \
            curl -s -X POST "$DISCORD_WEBHOOK" -H "Content-Type: application/json" -d @-

      - name: Notify on PR
        if: github.event_name == 'pull_request'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          TITLE=$(echo '${{ toJSON(github.event.pull_request.title) }}' | jq -r '.')
          URL="${{ github.event.pull_request.html_url }}"
          REPO="${{ github.repository }}"
          STATE="${{ github.event.pull_request.merged && 'merged' || github.event.action }}"
          if [ "$STATE" = "merged" ]; then
            ICON="🟣"
          elif [ "$STATE" = "closed" ]; then
            ICON="🔴"
          else
            ICON="🟢"
          fi
          MSG=$(echo -e "${ICON} **PR: ${TITLE}** (${STATE})\nRepo: \`${REPO}\`\n${URL}")
          jq -n --arg msg "$MSG" '{"content": $msg}' | \
            curl -s -X POST "$DISCORD_WEBHOOK" -H "Content-Type: application/json" -d @-

      - name: Notify on release
        if: github.event_name == 'release'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          NAME=$(echo '${{ toJSON(github.event.release.name) }}' | jq -r '.')
          URL="${{ github.event.release.html_url }}"
          REPO="${{ github.repository }}"
          MSG=$(echo -e "🚀 **New Release: ${NAME}**\nRepo: \`${REPO}\`\n${URL}")
          jq -n --arg msg "$MSG" '{"content": $msg}' | \
            curl -s -X POST "$DISCORD_WEBHOOK" -H "Content-Type: application/json" -d @-
