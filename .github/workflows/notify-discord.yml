name: Notify Discord

on:
  issues:
    types: [opened, closed, labeled]
  pull_request:
    types: [opened, closed, merged]
  release:
    types: [published]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Notify on issue
        if: github.event_name == 'issues'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          TITLE=$(echo '${{ toJSON(github.event.issue.title) }}' | jq -r '.')
          URL="${{ github.event.issue.html_url }}"
          REPO="${{ github.repository }}"
          jq -n --arg t "$TITLE" --arg r "$REPO" --arg u "$URL" \
            '{"content": "🟢 **" + $t + "**\nRepo: `" + $r + "`\n" + $u}' | \
            curl -s -X POST "$DISCORD_WEBHOOK" -H "Content-Type: application/json" -d @-

      - name: Notify on PR
        if: github.event_name == 'pull_request'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          TITLE=$(echo '${{ toJSON(github.event.pull_request.title) }}' | jq -r '.')
          URL="${{ github.event.pull_request.html_url }}"
          REPO="${{ github.repository }}"
          jq -n --arg t "$TITLE" --arg r "$REPO" --arg u "$URL" \
            '{"content": "🔀 **PR: " + $t + "**\nRepo: `" + $r + "`\n" + $u}' | \
            curl -s -X POST "$DISCORD_WEBHOOK" -H "Content-Type: application/json" -d @-

      - name: Notify on release
        if: github.event_name == 'release'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          NAME=$(echo '${{ toJSON(github.event.release.name) }}' | jq -r '.')
          URL="${{ github.event.release.html_url }}"
          REPO="${{ github.repository }}"
          jq -n --arg n "$NAME" --arg r "$REPO" --arg u "$URL" \
            '{"content": "🚀 **New Release: " + $n + "**\nRepo: `" + $r + "`\n" + $u}' | \
            curl -s -X POST "$DISCORD_WEBHOOK" -H "Content-Type: application/json" -d @-
