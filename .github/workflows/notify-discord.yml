name: Notify Discord

on:
  issues:
    types: [opened, closed, labeled]
  pull_request:
    types: [opened, closed, merged]
  release:
    types: [published]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Notify on issue
        if: github.event_name == 'issues'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          REPO: ${{ github.repository }}
          LABELS: ${{ toJSON(github.event.issue.labels.*.name) }}
        run: |
          ESCAPED_TITLE=$(echo "$ISSUE_TITLE" | sed 's/"/\\"/g')
          MSG="🟢 **${ESCAPED_TITLE}**\nRepo: \`${REPO}\`"
          if [ "$LABELS" != "[]" ]; then
            MSG="${MSG}\nLabels: ${LABELS}"
          fi
          MSG="${MSG}\n<${ISSUE_URL}>"
          curl -s -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{\"content\":\"$MSG\"}"

      - name: Notify on PR
        if: github.event_name == 'pull_request'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          REPO: ${{ github.repository }}
        run: |
          ESCAPED_TITLE=$(echo "$PR_TITLE" | sed 's/"/\\"/g')
          curl -s -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{\"content\":\"🔀 **PR: ${ESCAPED_TITLE}**\nRepo: \`${REPO}\`\n<${PR_URL}>\"}"

      - name: Notify on release
        if: github.event_name == 'release'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          REPO: ${{ github.repository }}
        run: |
          ESCAPED_NAME=$(echo "$RELEASE_NAME" | sed 's/"/\\"/g')
          curl -s -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{\"content\":\"🚀 **New Release: ${ESCAPED_NAME}**\nRepo: \`${REPO}\`\n<${RELEASE_URL}>\"}"
