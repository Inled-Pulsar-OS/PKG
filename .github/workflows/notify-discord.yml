name: Notify Discord

on:
  issues:
    types: [opened, closed]
  pull_request:
    types: [opened, closed, merged]
  release:
    types: [published]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Notify on issue
        if: github.event_name == 'issues'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_ACTION: ${{ github.event.action }}
          STATE_REASON: ${{ github.event.issue.state_reason }}
          REPO: ${{ github.repository }}
        run: |
          DIFF=$(echo "$ISSUE_BODY" | sed -n '/^### Difficulty$/,/^### /{/^### Difficulty$/d;/^### /d;p}' | head -1 | xargs)
          PHASE=$(echo "$ISSUE_BODY" | sed -n '/^### Roadmap Phase$/,/^### /{/^### Roadmap Phase$/d;/^### /d;p}' | head -1 | xargs)

          if [ "$ISSUE_ACTION" = "closed" ]; then
            if [ "$STATE_REASON" = "not_planned" ]; then
              ICON="⚪"
              STATUS="closed (not planned)"
            else
              ICON="🔴"
              STATUS="closed"
            fi
            MSG=$(echo -e "${ICON} **Issue: ${ISSUE_TITLE}** (${STATUS})\nRepo: \`${REPO}\`")
          else
            MSG=$(echo -e "🟢 **${ISSUE_TITLE}**\nRepo: \`${REPO}\`")
          fi
          [ -n "$DIFF" ] && MSG=$(echo -e "${MSG}\n📋 Difficulty: **${DIFF}**")
          [ -n "$PHASE" ] && MSG=$(echo -e "${MSG}\n🗺️ Roadmap: **${PHASE}**")
          MSG=$(echo -e "${MSG}\n${ISSUE_URL}")

          jq -n --arg msg "$MSG" '{"content": $msg}' | \
            curl -s -X POST "$DISCORD_WEBHOOK" -H "Content-Type: application/json" -d @-

      - name: Notify on PR
        if: github.event_name == 'pull_request'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_STATE: ${{ github.event.pull_request.merged && 'merged' || github.event.action }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$PR_STATE" = "merged" ]; then
            ICON="🟣"
          elif [ "$PR_STATE" = "closed" ]; then
            ICON="🔴"
          else
            ICON="🟢"
          fi
          MSG=$(echo -e "${ICON} **PR: ${PR_TITLE}** (${PR_STATE})\nRepo: \`${REPO}\`\n${PR_URL}")
          jq -n --arg msg "$MSG" '{"content": $msg}' | \
            curl -s -X POST "$DISCORD_WEBHOOK" -H "Content-Type: application/json" -d @-

      - name: Notify on release
        if: github.event_name == 'release'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          REPO: ${{ github.repository }}
        run: |
          MSG=$(echo -e "🚀 **New Release: ${RELEASE_NAME}**\nRepo: \`${REPO}\`\n${RELEASE_URL}")
          jq -n --arg msg "$MSG" '{"content": $msg}' | \
            curl -s -X POST "$DISCORD_WEBHOOK" -H "Content-Type: application/json" -d @-
