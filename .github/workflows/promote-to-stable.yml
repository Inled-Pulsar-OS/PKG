name: 🌟 Promote Package to Stable

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: 'Nombre del paquete(s) o "all" para promocionar a stable / Package name(s) or "all"'
        required: true
        default: 'all'
      pulsar_version:
        description: 'Versión del sistema (ej: 0.0.1-beta-pear) [Opcional] / System Version'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  promote:
    name: Promote to Stable
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Install Host Utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev fakeroot jq curl git

      - name: Build Debian Packages for Stable
        env:
          PULSAR_VERSION: "${{ github.event.inputs.pulsar_version }}"
          PKG_NAME: "${{ github.event.inputs.package_name }}"
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            -e PULSAR_VERSION="$PULSAR_VERSION" \
            -e DEBIAN_FRONTEND=noninteractive \
            -e GITHUB_ACTIONS="true" \
            -e CI="true" \
            -e USER=root \
            -e HOME=/root \
            debian:trixie bash -c "
              set -eo pipefail
              apt-get update
              apt-get install -y --no-install-recommends \
                build-essential cmake meson ninja-build git gettext blueprint-compiler \
                python3-gi python3-gi-cairo gobject-introspection gir1.2-glib-2.0 gir1.2-gtk-4.0 gir1.2-adw-1 \
                dpkg-dev fakeroot jq python3-pil python3-httpx ca-certificates curl pkg-config \
                unzip sassc libglib2.0-bin libglib2.0-dev-bin imagemagick dialog optipng sudo wget rsync gtk-update-icon-cache \
                libgtk-4-dev libadwaita-1-dev libgnome-desktop-4-dev libgnome-bg-4-dev \
                libgnome-rr-4-dev libgnome-bluetooth-ui-3.0-dev \
                libcolord-dev libcolord-gtk4-dev libgoa-1.0-dev libgoa-backend-1.0-dev \
                libgtop2-dev libgudev-1.0-dev libupower-glib-dev \
                libpwquality-dev libnm-dev libnma-gtk4-dev libsecret-1-dev \
                libpolkit-gobject-1-dev libmalcontent-0-dev \
                libaccountsservice-dev libglib2.0-dev libgdk-pixbuf-2.0-dev \
                libgirepository1.0-dev libgsound-dev libjson-glib-dev \
                libsoup-3.0-dev libwacom-dev libibus-1.0-dev \
                libkrb5-dev libgnutls28-dev libxi-dev libx11-dev \
                libxft-dev libxklavier-dev libxml2-dev libxml2-utils \
                libcups2-dev libgcr-4-dev libsmbclient-dev libudisks2-dev \
                libpulse-dev libtracker-sparql-3.0-dev \
                libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev \
                gnome-settings-daemon-dev gsettings-desktop-schemas-dev \
                docbook-xsl xsltproc modemmanager-dev libmm-glib-dev udisks2 \
                libgnome-autoar-0-dev libportal-dev libportal-gtk4-dev libtinysparql-dev \
                libgexiv2-dev libcloudproviders-dev libgraphene-1.0-dev \
                libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-base desktop-file-utils \
                nodejs npm

              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
              export PATH=\"/root/.cargo/bin:\$PATH\"

              chmod +x /workspace/package-and-deploy.sh
              ./package-and-deploy.sh '$PKG_NAME' --branch stable
              chmod -R a+rwX /workspace/build /workspace/PKG 2>/dev/null || true
            "

      - name: Build Arch Packages for Stable
        env:
          PULSAR_VERSION: "${{ github.event.inputs.pulsar_version }}"
          PKG_NAME: "${{ github.event.inputs.package_name }}"
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            -e PULSAR_VERSION="$PULSAR_VERSION" \
            -e GITHUB_ACTIONS="true" \
            -e CI="true" \
            archlinux:latest bash -c "
              pacman-key --init
              pacman-key --populate archlinux
              pacman -Syu --noconfirm base-devel git sudo jq curl wget gtk-update-icon-cache cmake meson ninja blueprint-compiler glib2-devel docbook-xsl rust webkit2gtk-4.1

              useradd -m builder
              echo 'builder ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
              chown -R builder:builder /workspace

              chmod +x /workspace/arch/package-and-deploy.sh
              sudo -u builder env PULSAR_VERSION=\"\$PULSAR_VERSION\" \
                bash -c 'cd /workspace/arch && ./package-and-deploy.sh \"\$0\" --branch stable' '$PKG_NAME'
            "

      - name: Deploy All Stable Packages (Debian + Arch)
        env:
          INLED_REPO_PAT: ${{ secrets.INLED_REPO_PAT }}
          GITHUB_ACTIONS: "true"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PULSAR_VERSION: "${{ github.event.inputs.pulsar_version }}"
          PKG_NAME: "${{ github.event.inputs.package_name }}"
        run: |
          echo "🚀 Desplegando paquetes promocionados a stable..."
          ./package-and-deploy.sh "$PKG_NAME" --deploy-only --branch stable
          ./arch/package-and-deploy.sh "$PKG_NAME" --deploy-only --branch stable
