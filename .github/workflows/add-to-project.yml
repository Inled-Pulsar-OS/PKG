name: Auto Add Issues to Project Board

on:
  issues:
    types: [opened]

permissions:
  issues: read

jobs:
  add-to-project:
    if: |
      !contains(github.event.issue.labels.*.name, 'deploy-package') &&
      !contains(github.event.issue.labels.*.name, 'Deploy-Package') &&
      !contains(github.event.issue.labels.*.name, 'deploy-packages')
    runs-on: ubuntu-latest
    steps:
      - name: Add issue to project
        id: add-project
        env:
          GH_TOKEN: ${{ secrets.PROJECT_PAT }}
        run: |
          ITEM_DATA=$(gh api graphql -f query='
            mutation($projectId: ID!, $issueId: ID!) {
              addProjectV2ItemById(input: {projectId: $projectId, contentId: $issueId}) {
                item { id }
              }
            }' \
            -f projectId="PVT_kwDOEGtWb84Bbe-_" \
            -f issueId="${{ github.event.issue.node_id }}" \
            --jq '.data.addProjectV2ItemById.item.id')
          echo "itemId=$ITEM_DATA" >> $GITHUB_OUTPUT

      - name: Set project fields
        if: steps.add-project.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.PROJECT_PAT }}
          ITEM_ID: ${{ steps.add-project.outputs.itemId }}
        run: |
          set +e
          PROJECT_ID="PVT_kwDOEGtWb84Bbe-_"
          ITEM_ID="${{ steps.add-project.outputs.itemId }}"

          # Fetch clean issue data
          ISSUE_DATA=$(gh api repos/${{ github.repository }}/issues/${{ github.event.issue.number }})
          BODY=$(echo "$ISSUE_DATA" | jq -r '.body // ""')
          LABELS=$(echo "$ISSUE_DATA" | jq -r '.labels[].name')

          set_field() {
            gh api graphql -f query='
              mutation($pid: ID!, $iid: ID!, $fid: ID!, $oid: String!) {
                updateProjectV2ItemFieldValue(input: {
                  projectId: $pid, itemId: $iid, fieldId: $fid,
                  value: { singleSelectOptionId: $oid }
                }) { projectV2Item { id } }
              }' \
              -f pid="$PROJECT_ID" -f iid="$ITEM_ID" \
              -f fid="$1" -f oid="$2" 2>&1 | grep -q '"errors"' && return 1
            return 0
          }

          extract_field() {
            echo "$BODY" | sed -n "/^### $1$/,/^### /{/^### $1$/d;/^### /d;p}" | head -1 | xargs
          }

          echo "LABELS: $LABELS"
          echo "BODY preview: $(echo "$BODY" | head -5)"

          # --- Tipo ---
          # Tipo options: Error=0fad1b2f, Idea=cdb185ea, Ayuda=bb79688a
          if echo "$LABELS" | grep -qi "bug\|error"; then
            echo "Setting Tipo=Error"
            set_field "PVTSSF_lADOEGtWb84Bbe-_zhWPMX0" "0fad1b2f" || true
          elif echo "$LABELS" | grep -qi "idea\|enhancement"; then
            echo "Setting Tipo=Idea"
            set_field "PVTSSF_lADOEGtWb84Bbe-_zhWPMX0" "cdb185ea" || true
          elif echo "$LABELS" | grep -qi "task\|suggestion\|help"; then
            echo "Setting Tipo=Ayuda"
            set_field "PVTSSF_lADOEGtWb84Bbe-_zhWPMX0" "bb79688a" || true
          fi

          # --- Difficulty ---
          # Options: Easy=4f37548b, Medium=2bdc8f09, Hard=2c706859, Expert=026f84c1
          DIFF=$(extract_field "Difficulty")
          echo "Difficulty: $DIFF"
          case "$DIFF" in
            *Easy*)   echo "Setting Difficulty=Easy";   set_field "PVTSSF_lADOEGtWb84Bbe-_zhfkocU" "4f37548b" || true ;;
            *Medium*) echo "Setting Difficulty=Medium"; set_field "PVTSSF_lADOEGtWb84Bbe-_zhfkocU" "2bdc8f09" || true ;;
            *Hard*)   echo "Setting Difficulty=Hard";   set_field "PVTSSF_lADOEGtWb84Bbe-_zhfkocU" "2c706859" || true ;;
            *Expert*) echo "Setting Difficulty=Expert"; set_field "PVTSSF_lADOEGtWb84Bbe-_zhfkocU" "026f84c1" || true ;;
          esac

          # --- Roadmap Phase ---
          # Options: Pear Edition Stable=900032c5, Tube OS=e2cdb253, Wintux=a3a19724, General=7606665f
          PHASE=$(extract_field "Roadmap Phase")
          echo "Roadmap Phase: $PHASE"
          case "$PHASE" in
            *Pear*)    echo "Setting Phase=Pear Edition Stable"; set_field "PVTSSF_lADOEGtWb84Bbe-_zhfkocY" "900032c5" || true ;;
            *Tube*)    echo "Setting Phase=Tube OS";             set_field "PVTSSF_lADOEGtWb84Bbe-_zhfkocY" "e2cdb253" || true ;;
            *Wintux*)  echo "Setting Phase=Wintux";              set_field "PVTSSF_lADOEGtWb84Bbe-_zhfkocY" "a3a19724" || true ;;
            *General*) echo "Setting Phase=General";              set_field "PVTSSF_lADOEGtWb84Bbe-_zhfkocY" "7606665f" || true ;;
          esac

          # --- Cost ---
          # Options: Low=0783fcec, Medium=be3bc85b, High=9e435e0f
          COST_VAL=$(extract_field "Cost")
          echo "Cost: $COST_VAL"
          case "$COST_VAL" in
            *Low*)    echo "Setting Cost=Low";    set_field "PVTSSF_lADOEGtWb84Bbe-_zhfkocg" "0783fcec" || true ;;
            *Medium*) echo "Setting Cost=Medium"; set_field "PVTSSF_lADOEGtWb84Bbe-_zhfkocg" "be3bc85b" || true ;;
            *High*)   echo "Setting Cost=High";   set_field "PVTSSF_lADOEGtWb84Bbe-_zhfkocg" "9e435e0f" || true ;;
          esac

          echo "Done"
