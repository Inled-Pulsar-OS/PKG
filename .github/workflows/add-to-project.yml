name: Auto Add Issues to Project Board

on:
  issues:
    types: [opened]

jobs:
  add-to-project:
    # Only run if the issue is NOT for package deployment (case-insensitive)
    # Solo ejecutar si el issue NO es para despliegue de paquetes (insensible a mayúsculas/minúsculas)
    if: |
      !contains(github.event.issue.labels.*.name, 'deploy-package') &&
      !contains(github.event.issue.labels.*.name, 'Deploy-Package') &&
      !contains(github.event.issue.labels.*.name, 'deploy-packages')
    runs-on: ubuntu-latest
    steps:
      - name: Add issue to project via GH CLI
        id: add-project
        env:
          GH_TOKEN: ${{ secrets.ADD_TO_PROJECT_PAT }}
        run: |
          # Add the issue to the organization project board using GitHub CLI
          # Añadir el issue al panel del proyecto de la organización usando la CLI de GitHub
          ITEM_DATA=$(gh project item-add "1" --owner "Inled-Pulsar-OS" --url "${{ github.event.issue.html_url }}" --format json)
          ITEM_ID=$(echo "$ITEM_DATA" | jq -r '.id')
          echo "itemId=$ITEM_ID" >> $GITHUB_OUTPUT

      - name: Set Type to Bug
        if: contains(github.event.issue.labels.*.name, 'bug')
        env:
          GITHUB_TOKEN: ${{ secrets.ADD_TO_PROJECT_PAT }}
          ITEM_ID: ${{ steps.add-project.outputs.itemId }}
        run: |
          gh api graphql -f query='
            mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
              updateProjectV2ItemFieldValue(input: {
                projectId: $projectId,
                itemId: $itemId,
                fieldId: $fieldId,
                value: {
                  singleSelectOptionId: $optionId
                }
              }) {
                projectV2Item {
                  id
                }
              }
            }' \
            -f projectId="PVT_kwDOEGtWb84Bbe-_" \
            -f itemId="$ITEM_ID" \
            -f fieldId="PVTSSF_lADOEGtWb84Bbe-_zhWPMX0" \
            -f optionId="45a5f370"

      - name: Set Type to Idea
        if: contains(github.event.issue.labels.*.name, 'idea')
        env:
          GITHUB_TOKEN: ${{ secrets.ADD_TO_PROJECT_PAT }}
          ITEM_ID: ${{ steps.add-project.outputs.itemId }}
        run: |
          gh api graphql -f query='
            mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
              updateProjectV2ItemFieldValue(input: {
                projectId: $projectId,
                itemId: $itemId,
                fieldId: $fieldId,
                value: {
                  singleSelectOptionId: $optionId
                }
              }) {
                projectV2Item {
                  id
                }
              }
            }' \
            -f projectId="PVT_kwDOEGtWb84Bbe-_" \
            -f itemId="$ITEM_ID" \
            -f fieldId="PVTSSF_lADOEGtWb84Bbe-_zhWPMX0" \
            -f optionId="b7b66bcf"

      - name: Set Type to Task
        if: contains(github.event.issue.labels.*.name, 'task')
        env:
          GITHUB_TOKEN: ${{ secrets.ADD_TO_PROJECT_PAT }}
          ITEM_ID: ${{ steps.add-project.outputs.itemId }}
        run: |
          # Get the option ID for "Task" from the Tipo field
          # Obtener el option ID para "Task" del campo Tipo
          OPTION_ID=$(gh api graphql -f query='
            query($project: ID!) {
              projectV2(number: 1, owner: "Inled-Pulsar-OS") {
                field(name: "Tipo") {
                  ... on ProjectV2SingleSelectField {
                    options {
                      id
                      name
                    }
                  }
                }
              }
            }' -f project="PVT_kwDOEGtWb84Bbe-_" --jq '.data.projectV2.field.options[] | select(.name == "Task") | .id')
          
          if [ -n "$OPTION_ID" ]; then
            gh api graphql -f query='
              mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                updateProjectV2ItemFieldValue(input: {
                  projectId: $projectId,
                  itemId: $itemId,
                  fieldId: $fieldId,
                  value: {
                    singleSelectOptionId: $optionId
                  }
                }) {
                  projectV2Item {
                    id
                  }
                }
              }' \
              -f projectId="PVT_kwDOEGtWb84Bbe-_" \
              -f itemId="$ITEM_ID" \
              -f fieldId="PVTSSF_lADOEGtWb84Bbe-_zhWPMX0" \
              -f optionId="$OPTION_ID"
          fi

      - name: Set Type to Suggestion
        if: contains(github.event.issue.labels.*.name, 'suggestion')
        env:
          GITHUB_TOKEN: ${{ secrets.ADD_TO_PROJECT_PAT }}
          ITEM_ID: ${{ steps.add-project.outputs.itemId }}
        run: |
          OPTION_ID=$(gh api graphql -f query='
            query($project: ID!) {
              projectV2(number: 1, owner: "Inled-Pulsar-OS") {
                field(name: "Tipo") {
                  ... on ProjectV2SingleSelectField {
                    options {
                      id
                      name
                    }
                  }
                }
              }
            }' -f project="PVT_kwDOEGtWb84Bbe-_" --jq '.data.projectV2.field.options[] | select(.name == "Suggestion") | .id')
          
          if [ -n "$OPTION_ID" ]; then
            gh api graphql -f query='
              mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                updateProjectV2ItemFieldValue(input: {
                  projectId: $projectId,
                  itemId: $itemId,
                  fieldId: $fieldId,
                  value: {
                    singleSelectOptionId: $optionId
                  }
                }) {
                  projectV2Item {
                    id
                  }
                }
              }' \
              -f projectId="PVT_kwDOEGtWb84Bbe-_" \
              -f itemId="$ITEM_ID" \
              -f fieldId="PVTSSF_lADOEGtWb84Bbe-_zhWPMX0" \
              -f optionId="$OPTION_ID"
          fi

      - name: Set Difficulty from body (Easy)
        if: contains(github.event.issue.body, 'Easy (1-2 hours)')
        env:
          GITHUB_TOKEN: ${{ secrets.ADD_TO_PROJECT_PAT }}
          ITEM_ID: ${{ steps.add-project.outputs.itemId }}
        run: |
          OPTION_ID=$(gh api graphql -f query='
            query($project: ID!) {
              projectV2(number: 1, owner: "Inled-Pulsar-OS") {
