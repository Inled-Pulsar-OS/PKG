name: Auto Add Issues to Project Board

on:
  issues:
    types: [opened]

jobs:
  add-to-project:
    if: |
      !contains(github.event.issue.labels.*.name, 'deploy-package') &&
      !contains(github.event.issue.labels.*.name, 'Deploy-Package') &&
      !contains(github.event.issue.labels.*.name, 'deploy-packages')
    runs-on: ubuntu-latest
    steps:
      - name: Add issue to project
        id: add-project
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ITEM_DATA=$(gh api graphql -f query='
            mutation($projectId: ID!, $issueId: ID!) {
              addProjectV2ItemById(input: {projectId: $projectId, contentId: $issueId}) {
                item { id }
              }
            }' \
            -f projectId="PVT_kwDOEGtWb84Bbe-_" \
            -f issueId="${{ github.event.issue.node_id }}" \
            --jq '.data.addProjectV2ItemById.item.id')
          echo "itemId=$ITEM_DATA" >> $GITHUB_OUTPUT

      - name: Set Tipo from labels
        if: |
          contains(github.event.issue.labels.*.name, 'bug') ||
          contains(github.event.issue.labels.*.name, 'idea') ||
          contains(github.event.issue.labels.*.name, 'task') ||
          contains(github.event.issue.labels.*.name, 'suggestion')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ITEM_ID: ${{ steps.add-project.outputs.itemId }}
        run: |
          # Determine option ID based on label
          if echo "${{ github.event.issue.labels.*.name }}" | grep -q "bug"; then
            OPTION_ID="0fad1b2f"
          elif echo "${{ github.event.issue.labels.*.name }}" | grep -q "idea"; then
            OPTION_ID="cdb185ea"
          elif echo "${{ github.event.issue.labels.*.name }}" | grep -q "task"; then
            OPTION_ID=$(gh api graphql -f query='
              query { projectV2(number: 1, owner: "Inled-Pulsar-OS") {
                field(name: "Tipo") { ... on ProjectV2SingleSelectField { options { id name } } }
              } }' --jq '.data.projectV2.field.options[] | select(.name == "Task") | .id')
          elif echo "${{ github.event.issue.labels.*.name }}" | grep -q "suggestion"; then
            OPTION_ID=$(gh api graphql -f query='
              query { projectV2(number: 1, owner: "Inled-Pulsar-OS") {
                field(name: "Tipo") { ... on ProjectV2SingleSelectField { options { id name } } }
              } }' --jq '.data.projectV2.field.options[] | select(.name == "Suggestion") | .id')
          fi

          if [ -n "$OPTION_ID" ]; then
            gh api graphql -f query='
              mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                updateProjectV2ItemFieldValue(input: {
                  projectId: $projectId, itemId: $itemId, fieldId: $fieldId,
                  value: { singleSelectOptionId: $optionId }
                }) { projectV2Item { id } }
              }' \
              -f projectId="PVT_kwDOEGtWb84Bbe-_" -f itemId="$ITEM_ID" \
              -f fieldId="PVTSSF_lADOEGtWb84Bbe-_zhWPMX0" -f optionId="$OPTION_ID"
          fi

      - name: Set Roadmap Phase to Pear Edition Stable
        if: "!contains(github.event.issue.labels.*.name, 'roadmap-tube') && !contains(github.event.issue.labels.*.name, 'roadmap-wintux')"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ITEM_ID: ${{ steps.add-project.outputs.itemId }}
        run: |
          OPTION_ID=$(gh api graphql -f query='
            query { projectV2(number: 1, owner: "Inled-Pulsar-OS") {
              field(name: "Roadmap Phase") { ... on ProjectV2SingleSelectField { options { id name } } }
            } }' --jq '.data.projectV2.field.options[] | select(.name == "Pear Edition Stable") | .id')

          if [ -n "$OPTION_ID" ]; then
            gh api graphql -f query='
              mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                updateProjectV2ItemFieldValue(input: {
                  projectId: $projectId, itemId: $itemId, fieldId: $fieldId,
                  value: { singleSelectOptionId: $optionId }
                }) { projectV2Item { id } }
              }' \
              -f projectId="PVT_kwDOEGtWb84Bbe-_" -f itemId="$ITEM_ID" \
              -f fieldId="PVTSSF_lADOEGtWb84Bbe-_zhfkocY" -f optionId="$OPTION_ID"
          fi
