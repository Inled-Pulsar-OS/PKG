name: Auto Add Issues to Project Board

on:
  issues:
    types: [opened]

permissions:
  issues: read

jobs:
  add-to-project:
    if: |
      !contains(github.event.issue.labels.*.name, 'deploy-package') &&
      !contains(github.event.issue.labels.*.name, 'Deploy-Package') &&
      !contains(github.event.issue.labels.*.name, 'deploy-packages')
    runs-on: ubuntu-latest
    steps:
      - name: Add issue to project
        id: add-project
        env:
          GH_TOKEN: ${{ secrets.PROJECT_PAT }}
        run: |
          ITEM_DATA=$(gh api graphql -f query='
            mutation($projectId: ID!, $issueId: ID!) {
              addProjectV2ItemById(input: {projectId: $projectId, contentId: $issueId}) {
                item { id }
              }
            }' \
            -f projectId="PVT_kwDOEGtWb84Bbe-_" \
            -f issueId="${{ github.event.issue.node_id }}" \
            --jq '.data.addProjectV2ItemById.item.id')
          echo "itemId=$ITEM_DATA" >> $GITHUB_OUTPUT

      - name: Set project fields
        if: steps.add-project.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.PROJECT_PAT }}
          ITEM_ID: ${{ steps.add-project.outputs.itemId }}
        run: |
          PROJECT_ID="PVT_kwDOEGtWb84Bbe-_"
          set +e

          # Fetch issue data directly from API to get clean body
          ISSUE_DATA=$(gh api repos/${{ github.repository }}/issues/${{ github.event.issue.number }})
          BODY=$(echo "$ISSUE_DATA" | jq -r '.body // ""')
          LABELS=$(echo "$ISSUE_DATA" | jq -r '.labels[].name')

          set_field() {
            gh api graphql -f query='
              mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                updateProjectV2ItemFieldValue(input: {
                  projectId: $projectId, itemId: $itemId, fieldId: $fieldId,
                  value: { singleSelectOptionId: $optionId }
                }) { projectV2Item { id } }
              }' \
              -f projectId="$PROJECT_ID" -f itemId="$ITEM_ID" \
              -f fieldId="$1" -f optionId="$2" 2>/dev/null || true
          }

          get_option() {
            gh api graphql -f query='
              query { projectV2(number: 1, owner: "Inled-Pulsar-OS") {
                field(name: "'"$1"'") { ... on ProjectV2SingleSelectField { options { id name } } }
              } }' --jq '.data.projectV2.field.options[] | select(.name == "'"$2"'") | .id' 2>/dev/null
          }

          extract_field() {
            echo "$BODY" | sed -n "/^### $1$/,/^### /{/^### $1$/d;/^### /d;p}" | head -1 | xargs
          }

          # --- Tipo (from labels) ---
          if echo "$LABELS" | grep -qi "bug\|error"; then
            set_field "PVTSSF_lADOEGtWb84Bbe-_zhWPMX0" "0fad1b2f"
          elif echo "$LABELS" | grep -qi "idea\|enhancement"; then
            set_field "PVTSSF_lADOEGtWb84Bbe-_zhWPMX0" "cdb185ea"
          elif echo "$LABELS" | grep -qi "task"; then
            OPT=$(get_option "Tipo" "Task")
            [ -n "$OPT" ] && set_field "PVTSSF_lADOEGtWb84Bbe-_zhWPMX0" "$OPT"
          elif echo "$LABELS" | grep -qi "suggestion"; then
            OPT=$(get_option "Tipo" "Suggestion")
            [ -n "$OPT" ] && set_field "PVTSSF_lADOEGtWb84Bbe-_zhWPMX0" "$OPT"
          fi

          # --- Difficulty ---
          DIFF=$(extract_field "Difficulty")
          if echo "$DIFF" | grep -q "Easy"; then
            OPT=$(get_option "Difficulty" "Easy")
            [ -n "$OPT" ] && set_field "PVTSSF_lADOEGtWb84Bbe-_zhfkocU" "$OPT"
          elif echo "$DIFF" | grep -q "Medium"; then
            OPT=$(get_option "Difficulty" "Medium")
            [ -n "$OPT" ] && set_field "PVTSSF_lADOEGtWb84Bbe-_zhfkocU" "$OPT"
          elif echo "$DIFF" | grep -q "Hard"; then
            OPT=$(get_option "Difficulty" "Hard")
            [ -n "$OPT" ] && set_field "PVTSSF_lADOEGtWb84Bbe-_zhfkocU" "$OPT"
          elif echo "$DIFF" | grep -q "Expert"; then
            OPT=$(get_option "Difficulty" "Expert")
            [ -n "$OPT" ] && set_field "PVTSSF_lADOEGtWb84Bbe-_zhfkocU" "$OPT"
          fi

          # --- Roadmap Phase ---
          PHASE=$(extract_field "Roadmap Phase")
          if [ -n "$PHASE" ]; then
            OPT=$(get_option "Roadmap Phase" "$PHASE")
            [ -n "$OPT" ] && set_field "PVTSSF_lADOEGtWb84Bbe-_zhfkocY" "$OPT"
          fi

          # --- Cost ---
          COST_VAL=$(extract_field "Cost")
          if [ -n "$COST_VAL" ]; then
            OPT=$(get_option "Cost" "$COST_VAL")
            [ -n "$OPT" ] && set_field "PVTSSF_lADOEGtWb84Bbe-_zhfkocg" "$OPT"
          fi

          echo "Done setting fields"
