                  ... on ProjectV2SingleSelectField {
                    options { id name }
                  }
                }
              }
            }' -f project="PVT_kwDOEGtWb84Bbe-_" --jq '.data.projectV2.field.options[] | select(.name == "Easy") | .id')
          
          if [ -n "$OPTION_ID" ]; then
            gh api graphql -f query='
              mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
