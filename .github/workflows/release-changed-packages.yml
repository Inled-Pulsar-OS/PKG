name: 🚀 Release Changed Packages (Arch + Debian)

on:
  push:
    branches:
      - main
      - stable
  workflow_dispatch:
    inputs:
      package_name:
        description: 'Paquetes a construir (comma-separated) | "all" para todos | "auto" para detectar cambios del último commit'
        required: false
        default: 'auto'
      branch:
        description: 'Rama del repositorio apt (stable, forky o rolling)'
        required: false
        default: 'stable'

permissions:
  contents: write

jobs:
  release:
    name: Detect, Build & Deploy
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout with full history so we can diff commit ranges
      - name: 🔽 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Install basic host utilities
      - name: 🛠️ Install Host Utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev fakeroot jq curl git

      # 3. Detect which packages changed in a [RELEASE] commit
      - name: 🔍 Detect Changed Packages
        id: detect
        run: |
          set -eu

          if [ "${{ github.event_name }}" = "push" ]; then
            AFTER="${{ github.sha }}"
            BEFORE="${{ github.event.before }}"
            ZERO="0000000000000000000000000000000000000000"
            if [ "$BEFORE" = "$ZERO" ]; then
              BEFORE=$(git rev-list --max-parents=0 HEAD 2>/dev/null || echo "$AFTER")
            fi

            # Only proceed if one of the pushed commits contains [RELEASE]
            MESSAGES=$(git log --format=%s "$BEFORE..$AFTER" 2>/dev/null || true)
            if ! echo "$MESSAGES" | grep -q '\[RELEASE\]'; then
              echo "⏭️  Ningún commit del push contiene [RELEASE]. Terminando."
              echo "should_build=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "✅ Commit(s) con [RELEASE] detectado(s)."

            FILES=$(git diff --name-only "$BEFORE..$AFTER" 2>/dev/null || true)
          else
            # workflow_dispatch
            PKG_INPUT="${{ github.event.inputs.package_name }}"
            if [ "$PKG_INPUT" = "all" ] || [ "$PKG_INPUT" = "auto" ] || [ -z "$PKG_INPUT" ]; then
              echo "should_build=true" >> "$GITHUB_OUTPUT"
              echo "debian_packages=all" >> "$GITHUB_OUTPUT"
              echo "arch_packages=all" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "debian_packages=$PKG_INPUT" >> "$GITHUB_OUTPUT"
            echo "arch_packages=$PKG_INPUT" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Recolectar la unión de paquetes cambiados (tanto si cambia su
          # carpeta Debian como su arch/pkgbuilds/*).
          CHANGED_PKGS=()
          if [ -n "$FILES" ]; then
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              # Debian: top-level folder con DEBIAN/control
              top="${f%%/*}"
              if [ -f "$top/DEBIAN/control" ]; then
                CHANGED_PKGS+=("$top")
                continue
              fi
              # Arch: folder bajo arch/pkgbuilds con PKGBUILD
              if [[ "$f" == arch/pkgbuilds/* ]]; then
                pkg=$(echo "$f" | cut -d/ -f3)
                if [ -d "arch/pkgbuilds/$pkg" ] && [ -f "arch/pkgbuilds/$pkg/PKGBUILD" ]; then
                  CHANGED_PKGS+=("$pkg")
                fi
              fi
            done <<< "$FILES"
          fi

          # Un único paquete puede empaquetarse para Debian, Arch o ambos.
          # Para cada paquete detectado, lo incluimos en la lista de cada
          # formato que tenga la infraestructura correspondiente.
          DEBIAN_PKGS=()
          ARCH_PKGS=()
          for p in $(printf '%s\n' "${CHANGED_PKGS[@]:-}" | sort -u); do
            if [ -f "$p/DEBIAN/control" ]; then
              DEBIAN_PKGS+=("$p")
            fi
            if [ -f "arch/pkgbuilds/$p/PKGBUILD" ]; then
              ARCH_PKGS+=("$p")
            fi
          done

          DEBIAN_UNIQ=$(printf '%s\n' "${DEBIAN_PKGS[@]:-}" | sort -u | paste -sd, -)
          ARCH_UNIQ=$(printf '%s\n' "${ARCH_PKGS[@]:-}" | sort -u | paste -sd, -)

          echo "📦 Paquetes Debian detectados: ${DEBIAN_UNIQ:-ninguno}"
          echo "📦 Paquetes Arch detectados: ${ARCH_UNIQ:-ninguno}"

          echo "should_build=true" >> "$GITHUB_OUTPUT"
          echo "debian_packages=${DEBIAN_UNIQ:-none}" >> "$GITHUB_OUTPUT"
          echo "arch_packages=${ARCH_UNIQ:-none}" >> "$GITHUB_OUTPUT"

      # 4. Build Debian Packages inside Docker (Debian Trixie)
      - name: 🔨 Build Debian Packages
        if: steps.detect.outputs.should_build == 'true' && steps.detect.outputs.debian_packages != 'none'
        env:
          TARGET_BRANCH: ${{ github.event.inputs.branch || 'stable' }}
          PKGS: ${{ steps.detect.outputs.debian_packages }}
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            -e GITHUB_ACTIONS="true" \
            -e CI="true" \
            -e USER=root \
            -e HOME=/root \
            debian:trixie bash -c "
              set -eo pipefail
              apt-get update
              apt-get install -y --no-install-recommends \
                build-essential cmake meson ninja-build git gettext blueprint-compiler \
                python3-gi python3-gi-cairo gobject-introspection gir1.2-glib-2.0 gir1.2-gtk-4.0 gir1.2-adw-1 \
                dpkg-dev fakeroot jq python3-pil python3-httpx ca-certificates curl pkg-config \
                unzip sassc libglib2.0-bin libglib2.0-dev-bin imagemagick dialog optipng sudo wget rsync gtk-update-icon-cache \
                libgtk-4-dev libadwaita-1-dev libgnome-desktop-4-dev libgnome-bg-4-dev \
                libgnome-rr-4-dev libgnome-bluetooth-ui-3.0-dev \
                libcolord-dev libcolord-gtk4-dev libgoa-1.0-dev libgoa-backend-1.0-dev \
                libgtop2-dev libgudev-1.0-dev libupower-glib-dev \
                libpwquality-dev libnm-dev libnma-gtk4-dev libsecret-1-dev \
                libpolkit-gobject-1-dev libmalcontent-0-dev \
                libaccountsservice-dev libglib2.0-dev libgdk-pixbuf-2.0-dev \
                libgirepository1.0-dev libgsound-dev libjson-glib-dev \
                libsoup-3.0-dev libwacom-dev libibus-1.0-dev \
                libkrb5-dev libgnutls28-dev libxi-dev libx11-dev \
                libxft-dev libxklavier-dev libxml2-dev libxml2-utils \
                libcups2-dev libgcr-4-dev libsmbclient-dev libudisks2-dev \
                libpulse-dev libtracker-sparql-3.0-dev \
                libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev \
                gnome-settings-daemon-dev gsettings-desktop-schemas-dev \
                docbook-xsl xsltproc modemmanager-dev libmm-glib-dev udisks2 \
                libgnome-autoar-0-dev libportal-dev libportal-gtk4-dev libtinysparql-dev \
                libgexiv2-dev libcloudproviders-dev libgraphene-1.0-dev \
                libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-base desktop-file-utils \
                nodejs npm

              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
              export PATH=\"/root/.cargo/bin:\$PATH\"

              chmod +x /workspace/package-and-deploy.sh
              ./package-and-deploy.sh '$PKGS' --branch '$TARGET_BRANCH'

              chmod -R a+rwX /workspace/build 2>/dev/null || true
            "

      # 5. Build Arch Packages inside Docker
      - name: 🔨 Build Arch Packages
        if: steps.detect.outputs.should_build == 'true' && steps.detect.outputs.arch_packages != 'none'
        env:
          TARGET_BRANCH: ${{ github.event.inputs.branch || 'stable' }}
          PKGS: ${{ steps.detect.outputs.arch_packages }}
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            -e GITHUB_ACTIONS="true" \
            -e CI="true" \
            archlinux:latest bash -c "
              pacman-key --init
              pacman-key --populate archlinux
              pacman -Syu --noconfirm base-devel git sudo jq curl wget gtk-update-icon-cache cmake meson ninja blueprint-compiler glib2-devel docbook-xsl rust webkit2gtk-4.1

              useradd -m builder
              echo 'builder ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
              chown -R builder:builder /workspace

              chmod +x /workspace/arch/package-and-deploy.sh
              sudo -u builder env PULSAR_VERSION='' \
                bash -c 'cd /workspace/arch && ./package-and-deploy.sh \"\$0\" --branch \"\$1\"' '$PKGS' '$TARGET_BRANCH'

              chmod -R a+rwX /workspace/build 2>/dev/null || true
            "

      # 6. Deploy all built packages to the central Inled APT repo
      - name: 🚀 Deploy to Inled APT
        if: steps.detect.outputs.should_build == 'true' && steps.detect.outputs.debian_packages != 'none' || steps.detect.outputs.should_build == 'true' && steps.detect.outputs.arch_packages != 'none'
        env:
          TARGET_BRANCH: ${{ github.event.inputs.branch || 'stable' }}
          INLED_REPO_PAT: ${{ secrets.INLED_REPO_PAT }}
          GITHUB_ACTIONS: "true"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ steps.detect.outputs.debian_packages }}" != "none" ]; then
            echo "🚀 Subiendo paquetes Debian a packages-repo (rama: $TARGET_BRANCH)..."
            ./package-and-deploy.sh "${{ steps.detect.outputs.debian_packages }}" --deploy-only --branch "$TARGET_BRANCH"
          fi
          if [ "${{ steps.detect.outputs.arch_packages }}" != "none" ]; then
            echo "🚀 Subiendo paquetes Arch a packages-repo (rama: $TARGET_BRANCH)..."
            ./arch/package-and-deploy.sh "${{ steps.detect.outputs.arch_packages }}" --deploy-only --branch "$TARGET_BRANCH"
          fi