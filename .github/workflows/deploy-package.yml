name: Deploy Package to Inled APT

on:
  issues:
    types: [opened, edited, labeled]

permissions:
  contents: write
  issues: write

jobs:
  deploy:
    name: Package Build and Deploy
    # Only run if the issue has the 'deploy-package' label (case-insensitive)
    # Solo ejecutar si el issue tiene la etiqueta 'deploy-package' (insensible a mayúsculas/minúsculas)
    if: |
      contains(github.event.issue.labels.*.name, 'deploy-package') ||
      contains(github.event.issue.labels.*.name, 'Deploy-Package') ||
      contains(github.event.issue.labels.*.name, 'deploy-packages')
    runs-on: ubuntu-latest

    steps:
      # 1. Comprobar permisos del actor (solo el administrador / propietario del repo)
      - name: Verify Admin Permissions
        id: verify-admin
        run: |
          AUTHOR="${{ github.event.issue.user.login }}"
          OWNER="${{ github.repository_owner }}"
          
          echo "Issue opened by: $AUTHOR"
          echo "Repository owner: $OWNER"
          
          # Se permite al dueño del repo, o si el usuario es explícitamente jaime (u otro admin configurado)
          if [ "$AUTHOR" = "$OWNER" ] || [ "$AUTHOR" = "jaime" ] || [ "$AUTHOR" = "InledGroup" ]; then
            echo "✅ Permiso concedido. Procediendo con el despliegue."
            echo "is_admin=true" >> $GITHUB_OUTPUT
          else
            echo "❌ Permiso denegado. Solo el administrador puede ejecutar esta acción."
            echo "is_admin=false" >> $GITHUB_OUTPUT
          fi

      # 2. Denegar acceso y cerrar el issue si no es admin
      - name: Close Unauthorized Issue
        if: steps.verify-admin.outputs.is_admin == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "⚠️ **Acceso Denegado:** Lo siento @${{ github.event.issue.user.login }}, no tienes permisos para iniciar el empaquetado y despliegue de paquetes de Pulsar OS. Esta acción está reservada únicamente para el administrador del repositorio."
          gh issue close "$ISSUE_NUMBER" --reason "not-planned"
          exit 1

      # 3. Checkout del código
      - name: Checkout Code
        uses: actions/checkout@v4

      # 4. Instalar herramientas necesarias en la máquina de construcción
      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev fakeroot jq

      # 5. Parsear el nombre del paquete desde el issue
      - name: Parse Package Name
        id: parse-package
        run: |
          BODY="${{ github.event.issue.body }}"
          
          # Intentar parsear el paquete usando regex simple
          PACKAGE=$(echo "$BODY" | grep -A 2 -i "Nombre del Paquete" | tail -n 1 | tr -d '[:space:]')
          
          # Fallback: si no se encuentra en el cuerpo, intentar parsearlo del título del issue
          if [ -z "$PACKAGE" ] || [ "$PACKAGE" = "--" ]; then
            TITLE="${{ github.event.issue.title }}"
            PACKAGE=$(echo "$TITLE" | sed -r 's/\[Deploy\]\s*//i' | tr -d '[:space:]')
          fi
          
          echo "Paquete detectado: '$PACKAGE'"
          
          # Verificar si la carpeta del paquete existe en el repositorio (excepto si es 'all')
          if [ "$PACKAGE" != "all" ] && [ ! -d "$PACKAGE" ]; then
            echo "❌ Error: El paquete '$PACKAGE' no existe en el repositorio."
            exit 1
          fi
          
          echo "package_name=$PACKAGE" >> $GITHUB_OUTPUT

      # 6. Comentar en el issue que ha comenzado la construcción
      - name: Comment Build Started
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          if [ "${{ steps.parse-package.outputs.package_name }}" = "all" ]; then
            gh issue comment "$ISSUE_NUMBER" --body "🏗️ **Comenzando compilación total:** Empaquetando y desplegando TODOS los paquetes del repositorio de forma masiva..."
          else
            gh issue comment "$ISSUE_NUMBER" --body "🏗️ **Comenzando la compilación:** Empaquetando la carpeta \`${{ steps.parse-package.outputs.package_name }}\` como archivo \`.deb\`..."
          fi

      # 7. Compilar y Desplegar el paquete
      - name: Build and Deploy Package
        id: build-deploy
        env:
          INLED_REPO_PAT: ${{ secrets.INLED_REPO_PAT }}
          GITHUB_ACTIONS: "true"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x package-and-deploy.sh
          # Ejecutar el script desde la raíz del repo
          ./package-and-deploy.sh "${{ steps.parse-package.outputs.package_name }}" --deploy

      # 8. Comentar éxito y cerrar issue
      - name: Comment Success and Close Issue
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          if [ "${{ steps.parse-package.outputs.package_name }}" = "all" ]; then
            gh issue comment "$ISSUE_NUMBER" --body "🎉 **¡Despliegue total completado con éxito!** Todos los paquetes del repositorio han sido compilados, subidos a la release y notificados al repositorio central APT de Inled."
          else
            gh issue comment "$ISSUE_NUMBER" --body "🎉 **¡Despliegue completado con éxito!** El paquete \`${{ steps.parse-package.outputs.package_name }}\` ha sido compilado, subido a los assets de la release del repo PKG y notificado al repositorio APT central de Inled. Estará disponible en breve."
          fi
          gh issue close "$ISSUE_NUMBER" --reason "completed"

      # 9. Comentar fallo en caso de error
      - name: Comment Failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "❌ **Error en la compilación o despliegue:** Ocurrió un error al intentar procesar el empaquetado. Por favor, revisa los logs de ejecución de GitHub Actions para ver los detalles del fallo."
