name: Community Task
description: A task available for community contributors. Pick it up and make Pulsar OS better!
title: "[TASK] "
labels: ["task", "community"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        ## 🤝 Community Task
        Thanks for picking up a task! Fill in the details below so others can understand the scope.

  - type: dropdown
    id: difficulty
    attributes:
      label: Difficulty
      description: How hard is this task?
      options:
        - Easy (1-2 hours)
        - Medium (4-8 hours)
        - Hard (1-2 days)
        - Expert (1+ week)
    validations:
      required: true

  - type: dropdown
    id: roadmap-phase
    attributes:
      label: Roadmap Phase
      description: Which phase of the roadmap does this belong to?
      options:
        - Pear Edition Stable
        - Tube OS
        - Wintux
        - General
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Task Description
      description: What needs to be done?
      placeholder: Describe the task clearly so anyone can pick it up...
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: How do we know this task is done?
      placeholder: |
        - [ ] Criterion 1
        - [ ] Criterion 2
        - [ ] Criterion 3
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Links, screenshots, or related issues.
    validations:
      required: false

  - type: checkboxes
    id: terms
    attributes:
      label: Contributor Agreement
      options:
        - label: I am willing to work on this task or I'm proposing it for others
          required: false
