# Pulsar OS - NVIDIA hibernate fixes
# PreserveVideoMemoryAllocations: preserva VRAM para restaurar estado tras hibernate.
# UseKernelSuspendNotifiers=0: evita que NVIDIA aborte la hibernación cuando la GPU está en uso.
# DynamicPowerManagement=0x00: evita que la GPU entre en D3cold durante el corte de corriente, resolviendo el bloqueo ACPI de BIOS AMI en portátiles HP OMEN.
options nvidia NVreg_PreserveVideoMemoryAllocations=1 NVreg_TemporaryFilePath=/var/tmp NVreg_UseKernelSuspendNotifiers=0 NVreg_DynamicPowerManagement=0x00
