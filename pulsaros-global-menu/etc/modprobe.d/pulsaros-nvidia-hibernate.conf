# Pulsar OS - NVIDIA hibernate configuration
# PreserveVideoMemoryAllocations: preserva VRAM para poder restaurar tras hibernate
# UseKernelSuspendNotifiers=0: deshabilita el notificador PM de NVIDIA que causaba
# 'Enabling HDA controller' y abortaba la hibernación en setups AMD+NVIDIA optimus
options nvidia NVreg_PreserveVideoMemoryAllocations=1 NVreg_TemporaryFilePath=/var/tmp NVreg_UseKernelSuspendNotifiers=0
