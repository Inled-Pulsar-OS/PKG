[package]
name = "pulsar-store"
version = "2.0.0-dev"
edition = "2021"
rust-version = "1.80"
authors = ["Jaime <info@inled.es>"]
license = "GPL-3.0-or-later"
description = "Unified app store for Pulsar OS"

[features]
default = ["ui"]
# GTK front end. Disable to build only `core` and the CLI binaries.
ui = ["dep:gtk4", "dep:adw"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
gtk4 = { version = "0.9", optional = true }
adw = { version = "0.7", package = "libadwaita", optional = true }
gettext-rs = "0.8.0"
ureq = "2"
dirs = "5"
unicode-normalization = "0.1"
sha2 = "0.10"
libc = "0.2"
tempfile = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }

[[bin]]
name = "pulsar-store"
path = "src/main.rs"
required-features = ["ui"]

[[bin]]
name = "pulsar-storectl"
path = "src/bin/storectl.rs"

[[bin]]
name = "pulsar-store-updated"
path = "src/bin/updated.rs"

[dev-dependencies]
jsonschema = { version = "0.33.0", default-features = false }
